{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="{% url 'contacts:list' %}" class="text-decoration-none text-muted small fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Contacts Directory
            </a>
            <span class="badge badge-soft-primary">Lead Record</span>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-navy"><i class="bi bi-person-lines-fill text-primary me-2"></i>{{ title }}</h5>
                {% if contact %}
                    <a href="{% url 'contacts:delete' contact.pk %}" class="btn btn-sm btn-outline-danger rounded-pill px-3" title="Delete Contact">
                        <i class="bi bi-trash me-1"></i> Delete
                    </a>
                {% endif %}
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a href="{% url 'contacts:list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> Save Contact
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
